<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>InstaCinema</title>
    <style>
      :root { color-scheme: light; font: 14px system-ui, sans-serif; }
      body { width: 290px; margin: 0; color: #172033; background: #f6f8fc; }
      header { display: flex; align-items: center; gap: 10px; padding: 16px 18px; color: white; background: linear-gradient(135deg, #e1306c, #833ab4); }
      header img { width: 32px; height: 32px; }
      h1 { margin: 0; font-size: 16px; }
      main { padding: 16px 18px 18px; }
      #status { min-height: 42px; margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; color: #46516a; background: white; line-height: 1.35; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      button { border: 0; border-radius: 8px; padding: 9px 10px; font: inherit; cursor: pointer; }
      #stop { color: #a51d3f; background: #fce7ee; }
      #export { color: white; background: #833ab4; }
      button:disabled { cursor: default; opacity: .45; }
      .hint { margin: 12px 0 0; color: #768198; font-size: 12px; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon.svg" alt=""><h1>InstaCinema Collector</h1></header>
    <main>
      <div id="status">Starting…</div>
      <div class="actions"><button id="stop" disabled>Stop</button></div>
      <p class="hint">Captures are saved automatically to Downloads when finished.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
